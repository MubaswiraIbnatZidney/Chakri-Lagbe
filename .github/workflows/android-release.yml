name: Android Release

# Triggers when you push a version tag like: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the Base64-encoded keystore stored in GitHub Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/chakri-lagbe-release.jks

      # Build signed release APK
      - name: Build Release APK (Signed)
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/chakri-lagbe-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            --stacktrace

      # Get the version tag name (e.g., v1.0.0)
      - name: Get tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Rename APK to include version
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/chakri-lagbe-${{ steps.get_tag.outputs.TAG }}.apk

      # Create a GitHub Release and attach the signed APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          name: "Chakri Lagbe! ${{ steps.get_tag.outputs.TAG }}"
          body: |
            ## 📦 Chakri Lagbe! ${{ steps.get_tag.outputs.TAG }}

            ### Installation
            1. Download the APK below
            2. On your Android device: Settings → Security → Allow unknown sources
            3. Install the APK

            ### Requirements
            - Android 5.0 (Lollipop) or higher (API 21+)

            ---
            *Built automatically by GitHub Actions from commit ${{ github.sha }}*
          files: app/build/outputs/apk/release/chakri-lagbe-${{ steps.get_tag.outputs.TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
